<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flox OTP Spammer</title>
    <style>
        body { background-color: #0d0d0d; color: #fff; font-family: monospace; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background: #1a1a1a; padding: 30px; border-radius: 10px; border: 1px solid #333; width: 90%; max-width: 400px; box-shadow: 0 0 20px rgba(255,0,0,0.2); }
        h1 { color: #ff3333; text-align: center; text-shadow: 0 0 10px #ff3333; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin-bottom: 15px; background: #000; border: 1px solid #ff3333; color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #ff3333; color: #fff; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 16px; transition: 0.3s; }
        button:hover { background: #cc0000; box-shadow: 0 0 15px #ff3333; }
        #result { margin-top: 20px; font-size: 12px; color: #0f0; background: #000; padding: 10px; border-radius: 5px; max-height: 150px; overflow-y: auto; display: none; }
    </style>
</head>
<body>
    <div class="container">
        <h1>[ FLOX OTP ]</h1>
        <input type="number" id="phone" placeholder="Masukkan Nomor (08xxx)">
        <input type="number" id="amount" placeholder="Jumlah Spam (max 10)" value="1">
        <button onclick="spamOTP()" id="btn">TEMBAK OTP</button>
        <div id="result"></div>
    </div>

    <script>
        async function spamOTP() {
            const phone = document.getElementById('phone').value;
            const amount = document.getElementById('amount').value;
            const btn = document.getElementById('btn');
            const resultDiv = document.getElementById('result');

            if (!phone) return alert('Masukkan nomor dulu!');
            
            btn.innerText = "MEMPROSES...";
            btn.disabled = true;
            resultDiv.style.display = 'block';
            resultDiv.innerHTML = 'Mengirim request...<br>';

            for (let i = 1; i <= amount; i++) {
                try {
                    const res = await fetch('/api/otp', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ phone: phone })
                    });
                    const data = await res.json();
                    resultDiv.innerHTML += `[${i}/${amount}] Status: ${res.status} - Tembakan Berhasil<br>`;
                    resultDiv.scrollTop = resultDiv.scrollHeight;
                } catch (err) {
                    resultDiv.innerHTML += `[${i}/${amount}] ERROR: Gagal konek<br>`;
                }
            }
            btn.innerText = "TEMBAK OTP";
            btn.disabled = false;
        }
    </script>
</body>
</html>
